name: Build Feather

on:
 push:
   branches: [ main ]
 workflow_dispatch:

jobs:
 build:
   runs-on: macos-latest
   steps:
     - uses: actions/checkout@v4
       with:
         submodules: recursive

     - name: Import Certificate
       env:
         CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
         CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
       run: |
         echo $CERTIFICATE_P12 | base64 --decode > certificate.p12
         openssl pkcs12 -in certificate.p12 -out cert.pem -passin pass:$CERTIFICATE_PASSWORD -passout pass:temp123 -nomacver
         openssl pkcs12 -export -in cert.pem -out certificate_new.p12 -passout pass:temp123
         security create-keychain -p "temp" build.keychain
         security default-keychain -s build.keychain
         security unlock-keychain -p "temp" build.keychain
         security import certificate_new.p12 -k build.keychain -P "temp123" -T /usr/bin/codesign -T /usr/bin/security
         security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp" build.keychain

     - name: Import Provisioning Profile
       env:
         PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
       run: |
         echo $PROVISIONING_PROFILE | base64 --decode > profile.mobileprovision
         mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
         cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

     - name: Build
       run: |
         xcodebuild -workspace Feather.xcworkspace \
           -scheme Feather \
           -configuration Release \
           -archivePath build/Feather.xcarchive \
           CODE_SIGN_IDENTITY="Apple Distribution" \
           DEVELOPMENT_TEAM=RTRUJ5BXJQ \
           PRODUCT_BUNDLE_IDENTIFIER=app.honeydew5629.yunqu9279 \
           archive

     - name: Export IPA
       run: |
         cat > ExportOptions.plist << EOF
         <?xml version="1.0" encoding="UTF-8"?>
         <plist version="1.0">
         <dict>
           <key>method</key>
           <string>ad-hoc</string>
           <key>teamID</key>
           <string>RTRUJ5BXJQ</string>
         </dict>
         </plist>
         EOF
         xcodebuild -exportArchive \
           -archivePath build/Feather.xcarchive \
           -exportPath build/ \
           -exportOptionsPlist ExportOptions.plist

     - name: Upload IPA
       uses: actions/upload-artifact@v4
       with:
         name: Feather.ipa
         path: build/*.ipa
